<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>量化终端 | zhangshen.ccwu.cc</title>
  <meta name="description" content="量化终端在线入口：多市场行情、策略回测和实时信号决策台。" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c14;
      --panel: #0d1422;
      --line: #1c2a3e;
      --text: #f3f6fb;
      --muted: #8fa0b8;
      --gold: #f0b90b;
      --green: #2ebd85;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow: hidden; }

    .shell { height: 100vh; display: grid; grid-template-rows: 56px 1fr; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      background: rgba(8, 12, 20, 0.96);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f0b90b, #2ebd85);
      color: #081016;
      font-weight: 900;
      letter-spacing: 0;
    }
    .title { min-width: 0; }
    h1 { margin: 0; font-size: 15px; line-height: 1.2; font-weight: 750; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px rgba(46,189,133,.75); }
    a.button {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #33445f;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      background: #111b2c;
      font-size: 13px;
      white-space: nowrap;
    }
    a.button:hover { border-color: var(--gold); color: var(--gold); }
    iframe { width: 100%; height: 100%; border: 0; background: #0e1117; }

    .fallback {
      position: fixed;
      inset: 72px 16px auto 16px;
      max-width: 720px;
      margin: auto;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(13, 20, 34, 0.92);
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    @media (max-width: 700px) {
      .shell { grid-template-rows: 50px 1fr; }
      .bar { padding: 0 10px; gap: 8px; }
      .mark { width: 28px; height: 28px; }
      .sub, .status { display: none; }
      h1 { font-size: 14px; }
      a.button { height: 32px; padding: 0 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">
        <div class="mark">Q</div>
        <div class="title">
          <h1>量化终端</h1>
          <div class="sub">多市场行情 · 策略回测 · 实时信号决策台</div>
        </div>
      </div>
      <div class="actions">
        <div class="status"><span class="dot"></span><span>HF Space 在线</span></div>
        <a class="button" href="https://jiaze66-quantify-free-server.hf.space" target="_blank" rel="noopener">新窗口打开</a>
      </div>
    </header>
    <iframe title="量化终端" src="https://jiaze66-quantify-free-server.hf.space"></iframe>
  </div>
  <div class="fallback">
    如果页面没有加载，请点击右上角“新窗口打开”。免费 Space 休眠后首次访问可能需要等待几十秒。
  </div>
  <script>
    window.setTimeout(function () {
      document.querySelector('.fallback').style.display = 'block';
    }, 12000);
  </script>
</body>
</html>
